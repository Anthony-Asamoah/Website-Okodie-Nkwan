name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject EmailJS config
        run: |
          cat > static/js/config.js <<'EOF'
          var EMAILJS_CONFIG = {
            publicKey:        "${{ secrets.EMAILJS_PUBLIC_KEY }}",
            serviceId:        "${{ secrets.EMAILJS_SERVICE_ID }}",
            templateId:       "${{ secrets.EMAILJS_TEMPLATE_ID }}",
            recaptchaSiteKey: "${{ secrets.RECAPTCHA_SITE_KEY }}"
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing, Yahoo, DuckDuckGo, Yandex, Seznam and Naver that the page
      # changed, instead of waiting for their next crawl. Key file must stay at
      # https://okodienkwan.com/<key>.txt for the request to be accepted.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: aacb809b64b1a07b0d37a824d6f4e17f
        run: |
          curl -sS -o /dev/null -w 'IndexNow responded %{http_code}\n' \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fokodienkwan.com%2F&key=${INDEXNOW_KEY}&keyLocation=https%3A%2F%2Fokodienkwan.com%2F${INDEXNOW_KEY}.txt"
